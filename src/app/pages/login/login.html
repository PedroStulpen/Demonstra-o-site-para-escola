<div class="login-box card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 textoTitulo mb-1"><i class="bi bi-mortarboard-fill"></i> Escola Demo</h1>
    <p class="text-muted">Entre para acessar o sistema.</p>
    <label class="form-label">E-mail</label>
    <input type="email" class="form-control mb-3" [(ngModel)]="email" (keyup.enter)="entrar()" />
    <label class="form-label">Senha</label>
    <input type="password" class="form-control mb-3" [(ngModel)]="senha" (keyup.enter)="entrar()" />
    @if (erro) { <div class="error mb-3">{{ erro }}</div> }
    <button class="btn btn-primary w-100" (click)="entrar()">Entrar</button>
    <small class="d-block text-muted mt-3">Demo: admin&#64;escola.com / 123456</small>
  </div>
</div>
