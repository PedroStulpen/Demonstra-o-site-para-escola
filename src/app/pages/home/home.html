<div class="container pt-4">
  <div class="row barraTitulo mb-3"><div class="col pt-3"><span class="textoTitulo">Meu perfil</span></div></div>
  <div class="row g-3">
    <div class="col-12 col-lg-5">
      <div class="card"><div class="card-body d-flex align-items-center gap-3">
        <i class="bi bi-person-circle" style="font-size: 3.5rem; color: var(--verde)"></i>
        <div>
          <div class="h5 mb-0">{{ auth.usuario()?.nome }}</div>
          <div class="text-muted">{{ auth.usuario()?.cargo }}</div>
          <div class="text-muted small">{{ auth.usuario()?.email }}</div>
        </div>
      </div></div>
    </div>
    <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body"><div class="display-6">{{ ativos }}</div>alunos ativos</div></div></div>
    <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body"><div class="display-6">{{ turmas }}</div>turmas</div></div></div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <a class="btn btn-primary" routerLink="/alunos"><i class="bi bi-people"></i> Cadastrar aluno</a>
    <a class="btn btn-outline-secondary" routerLink="/notas"><i class="bi bi-journal-check"></i> Lançar notas</a>
  </div>
</div>
